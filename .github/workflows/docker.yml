# Build the image and publish it to GitHub's own registry.
#
# Uses the automatic GITHUB_TOKEN — no secret to create, nothing to rotate.
# Tags follow the release: a push to main refreshes :edge, a v* tag publishes
# that version and moves :latest.

name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A pull request builds but must not publish; only the repository's own
      # branches and tags push an image.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ github.event_name == 'pull_request' }}

      # Building is not proof. Start it and ask it whether it is alive, so a
      # broken image never reaches the registry tag people are told to run.
      - name: Smoke-test the image
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name t -p 8787:8787 ${{ env.IMAGE }}:${{ github.sha }} || \
          docker run -d --name t -p 8787:8787 "$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          for i in $(seq 1 30); do
            if curl -fsS localhost:8787/healthz; then ok=1; break; fi
            sleep 2
          done
          echo
          [ "${ok:-0}" = "1" ] || { docker logs t; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8787/mcp -H 'content-type: application/json' -d '{}')" = "401"
          docker exec t /app/bin/wacli --version
